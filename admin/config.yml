backend:
  name: github
  repo: mateuszpidek-lgtm/forma-website
  branch: main
  base_url: https://forma-cms-auth.mateusz-pidek.workers.dev
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "pl"

collections:
  - name: "site_texts"
    label: "Teksty strony"
    files:
      - name: "site_texts"
        label: "Teksty strony"
        file: "data/site-texts.json"
        fields:
          - { label: "Nagłówek sekcji 'O nas'", name: "about_heading", widget: "string", hint: "Można użyć <br> dla podziału linii." }
          - { label: "Tekst sekcji 'O nas'", name: "about_text", widget: "text" }
          - { label: "Zajawka nad formularzem kontaktowym", name: "kontakt_lead", widget: "string" }
          - { label: "Nagłówek 'Co nas wyróżnia?'", name: "wyroznia_heading", widget: "string" }
          - { label: "Nagłówek: Zajęcia artystyczne", name: "artystyczne_heading", widget: "string", hint: "Można użyć <br> dla podziału linii." }
          - { label: "Opis: Zajęcia artystyczne", name: "artystyczne_lead", widget: "text" }
          - { label: "Nagłówek: Zajęcia taneczne", name: "taneczne_heading", widget: "string", hint: "Można użyć <br> dla podziału linii." }
          - { label: "Opis: Zajęcia taneczne", name: "taneczne_lead", widget: "text" }
          - { label: "Nagłówek: Zajęcia sportowe", name: "sportowe_heading", widget: "string", hint: "Można użyć <br> dla podziału linii." }
          - { label: "Opis: Zajęcia sportowe", name: "sportowe_lead", widget: "text" }
          - { label: "Nagłówek: Co oferujemy? (matura)", name: "matura_oferta_heading", widget: "string" }
          - { label: "Opis: Co oferujemy? (matura)", name: "matura_oferta_lead", widget: "text" }
          - { label: "Nagłówek: Nasz ebook", name: "produkty_heading", widget: "string" }
          - { label: "Tekst w stopce (copyright)", name: "footer_copyright", widget: "string" }

  - name: "company"
    label: "Dane firmowe i social media"
    files:
      - name: "company"
        label: "Dane firmowe i social media"
        file: "data/company.json"
        fields:
          - { label: "Telefon (do linku tel:, np. +48518575233)", name: "kontakt_phone", widget: "string" }
          - { label: "Telefon (wyświetlany tekst)", name: "kontakt_phone_display", widget: "string" }
          - { label: "E-mail", name: "kontakt_email", widget: "string" }
          - { label: "Start zajęć", name: "kontakt_start", widget: "string" }
          - { label: "Informacja o zapisach", name: "kontakt_zapisy", widget: "string" }
          - { label: "Adres (ulica, kod, miasto)", name: "kontakt_address", widget: "string" }
          - { label: "Nazwa szkoły / placówki", name: "school_name", widget: "string" }
          - { label: "Link do Instagrama", name: "instagram_url", widget: "string" }
          - { label: "Link do YouTube", name: "youtube_url", widget: "string" }
          - { label: "Link do TikToka", name: "tiktok_url", widget: "string" }

  - name: "section_images"
    label: "Zdjęcia i ikony sekcji"
    files:
      - name: "section_images"
        label: "Zdjęcia i ikony sekcji"
        file: "data/section-images.json"
        fields:
          - name: "artystyczne"
            label: "Zajęcia artystyczne"
            widget: "object"
            fields:
              - { label: "Ikona / logo", name: "badge", widget: "image" }
              - { label: "Zdjęcie zajęć", name: "photo", widget: "image" }
              - { label: "Etykieta w hero (rotujące logo)", name: "hero_label", widget: "string" }
          - name: "taneczne"
            label: "Zajęcia taneczne"
            widget: "object"
            fields:
              - { label: "Ikona / logo", name: "badge", widget: "image" }
              - { label: "Zdjęcie zajęć", name: "photo", widget: "image" }
              - { label: "Etykieta w hero (rotujące logo)", name: "hero_label", widget: "string" }
          - name: "sportowe"
            label: "Zajęcia sportowe"
            widget: "object"
            fields:
              - { label: "Ikona / logo", name: "badge", widget: "image" }
              - { label: "Zdjęcie zajęć", name: "photo", widget: "image" }
              - { label: "Etykieta w hero (rotujące logo)", name: "hero_label", widget: "string" }
          - name: "matura"
            label: "Matematyka maturalna"
            widget: "object"
            fields:
              - { label: "Ikona / logo", name: "badge", widget: "image" }
              - { label: "Zdjęcie zajęć", name: "photo", widget: "image" }
              - { label: "Etykieta w hero (rotujące logo)", name: "hero_label", widget: "string" }

  - name: "pricing_dzieci"
    label: "Cennik — zajęcia dla dzieci"
    files:
      - name: "pricing_dzieci"
        label: "Cennik — zajęcia dla dzieci"
        file: "data/pricing-dzieci.json"
        fields:
          - name: "cards"
            label: "Karty cennika"
            widget: "list"
            summary: "{{title}} — {{price}}"
            fields:
              - { label: "Kategoria (art / sport / dance)", name: "cat", widget: "select", options: ["art", "sport", "dance"] }
              - { label: "Etykieta (badge)", name: "badge", widget: "string" }
              - { label: "Kolor etykiety", name: "badgeClass", widget: "select", options: ["dzieci", "sport", "matura"] }
              - { label: "Tytuł zajęć", name: "title", widget: "string" }
              - name: "meta"
                label: "Wiersze informacyjne"
                widget: "list"
                fields:
                  - { label: "Ikona (emoji)", name: "icon", widget: "string" }
                  - { label: "Tekst", name: "text", widget: "string" }
              - { label: "Częstotliwość (np. 1x/tydz.)", name: "frequency", widget: "string" }
              - { label: "Cena (np. 200 zł/mies.)", name: "price", widget: "string" }
              - { label: "Rabat (opcjonalnie)", name: "discount", widget: "string", required: false }
              - { label: "Tekst przycisku", name: "buttonText", widget: "string" }
              - { label: "Temat w formularzu zgłoszeniowym", name: "formTag", widget: "string" }

  - name: "pricing_matura"
    label: "Cennik — matura z matematyki"
    files:
      - name: "pricing_matura"
        label: "Cennik — matura z matematyki"
        file: "data/pricing-matura.json"
        fields:
          - name: "cards"
            label: "Karty cennika"
            widget: "list"
            summary: "{{title}} — {{price}}"
            fields:
              - { label: "Kategoria (podst / zaaw / indyw)", name: "cat", widget: "select", options: ["podst", "zaaw", "indyw"] }
              - { label: "Etykieta (badge)", name: "badge", widget: "string" }
              - { label: "Kolor etykiety", name: "badgeClass", widget: "select", options: ["dzieci", "sport", "matura"] }
              - { label: "Tytuł", name: "title", widget: "string" }
              - { label: "Opis (HTML, można użyć <br>)", name: "metaText", widget: "text" }
              - { label: "Częstotliwość (np. 2x/tydz.)", name: "frequency", widget: "string" }
              - { label: "Cena (np. 400 zł/mies.)", name: "price", widget: "string" }
              - { label: "Rabat (opcjonalnie)", name: "discount", widget: "string", required: false }
              - { label: "Tekst przycisku", name: "buttonText", widget: "string" }
              - { label: "Temat w formularzu zgłoszeniowym", name: "formTag", widget: "string" }

  - name: "instagram"
    label: "Posty Instagram / Blog"
    files:
      - name: "instagram"
        label: "Posty Instagram / Blog"
        file: "data/instagram.json"
        fields:
          - name: "posts"
            label: "Posty"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "ID posta z Instagrama (z linku instagram.com/p/XXXX)", name: "id", widget: "string" }
              - { label: "Zdjęcie", name: "img", widget: "image" }
              - { label: "Podpis", name: "caption", widget: "text" }

  - name: "youtube"
    label: "Filmy YouTube"
    files:
      - name: "youtube"
        label: "Filmy YouTube"
        file: "data/youtube.json"
        fields:
          - name: "videos"
            label: "Filmy"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "ID filmu z YouTube (z linku youtube.com/watch?v=XXXX)", name: "id", widget: "string" }
              - { label: "Tytuł", name: "title", widget: "string" }
